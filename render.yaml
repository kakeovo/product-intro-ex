services:
  - type: web
    name: product-intro-ex
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn wsgi:app"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: product_intro_ex_db
          property: connectionString
      - key: CLAUDE_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false

databases:
  - name: product_intro_ex_db
    databaseName: product_intro_ex
    user: product_intro_ex_user
    region: ohio
    postgresMajorVersion: "14"

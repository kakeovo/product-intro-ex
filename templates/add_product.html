{% extends "base.html" %}

{% block title %}商品追加 - 商品紹介EX{% endblock %}

{% block content %}
<div class="add-product-page">
    <h2>新しい商品を追加</h2>

    <form method="POST" class="form-add-product">
        <div class="form-group">
            <label for="url">商品URL *</label>
            <input type="url" id="url" name="url" required placeholder="https://example.com/product">
            <small>メタデータは自動で取得されます</small>
        </div>

        <div class="form-group">
            <label for="title">商品名 *</label>
            <input type="text" id="title" name="title" required placeholder="商品名">
        </div>

        <div class="form-group">
            <label for="description">説明</label>
            <textarea id="description" name="description" rows="4" placeholder="商品の説明（オプション）"></textarea>
        </div>

        <div class="form-group">
            <label for="category">カテゴリー</label>
            <select id="category" name="category">
                <option value="uncategorized">未分類</option>
                <option value="gadget">ガジェット</option>
                <option value="fashion">ファッション</option>
                <option value="home">ホーム</option>
                <option value="lifestyle">ライフスタイル</option>
                <option value="other">その他</option>
            </select>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">追加</button>
            <a href="{{ url_for('ui.products_list') }}" class="btn btn-secondary">キャンセル</a>
        </div>
    </form>
</div>
{% endblock %}

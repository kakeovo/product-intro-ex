<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}商品紹介EX{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">商品紹介EX</h1>
            <ul class="nav-menu">
                <li><a href="{{ url_for('ui.dashboard') }}">ダッシュボード</a></li>
                <li><a href="{{ url_for('ui.products_list') }}">商品管理</a></li>
                <li><a href="{{ url_for('ui.post_history') }}">投稿履歴</a></li>
            </ul>
        </div>
    </nav>

    <div class="container main-content">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <footer>
        <p>&copy; 2026 商品紹介EX. All rights reserved.</p>
    </footer>
</body>
</html>
